services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-adveno}
      POSTGRES_USER: ${POSTGRES_USER:-adveno}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adveno_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - adveno

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-adveno}:${POSTGRES_PASSWORD:-adveno_dev_password}@db:5432/${POSTGRES_DB:-adveno}
      JWT_SECRET: ${JWT_SECRET:-development-only-change-me}
      JWT_ISSUER: ${JWT_ISSUER:-adveno}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-adveno-api}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"]
    networks:
      - adveno

volumes:
  postgres_data:

networks:
  adveno:

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: adveno
          POSTGRES_USER: adveno
          POSTGRES_PASSWORD: adveno_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adveno -d adveno"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://adveno:adveno_ci_password@localhost:5432/adveno
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.5"
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run alembic upgrade head
      - run: uv run pytest tests/unit
      - run: uv run pytest tests/integration -m integration
      - run: uv run pytest --cov=src --cov-report=term-missing --cov-report=xml
